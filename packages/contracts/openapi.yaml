  responses:
    BadRequest:
      description: SPA origin/session required.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Missing, expired or invalid authentication/credentials.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Operation not permitted for this authentication method.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: HTTP method not allowed.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfMismatch:
      description: Missing or invalid SPA CSRF token.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Input validation failed.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate exceeded; retry after the indicated delay.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected failure; no internal details returned.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotReady:
      description: PostgreSQL connection/vector extension unavailable.
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
